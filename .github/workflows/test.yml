name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Start server
        run: node server.js &
        env:
          SESSION_SECRET: ci-test-secret-at-least-32-chars-long
          NODE_ENV: development

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 15000

      - name: Run test suite
        run: node tests/fulltest.cjs
        env:
          SESSION_SECRET: ci-test-secret-at-least-32-chars-long

      - name: Run edge case tests
        run: node tests/edgetest.cjs
        env:
          SESSION_SECRET: ci-test-secret-at-least-32-chars-long
